name: Deploy Gate

# Agent→prod gate (2026-08-25 audit, P1-Security #6 / C1).
#
# Today Vercel auto-deploys every push to main and CI runs AFTER the
# fact — detection, not prevention. The dream agent ships ~12×/day, so
# a broken push is live before anyone notices.
#
# This workflow flips that: CI (lint + typecheck + tests) runs first,
# and ONLY on success does it hit a Vercel Deploy Hook to trigger the
# production build.
#
# ── INERT-BUT-READY ──────────────────────────────────────────────────
# Until the one-time manual setup in docs/deploy-gate.md is done
# (create the deploy hook, add the VERCEL_DEPLOY_HOOK_URL secret,
# disable Vercel's git auto-deploy), the deploy step below simply
# skips — current auto-deploy behavior is completely unchanged. This
# file breaks nothing by existing.
# ─────────────────────────────────────────────────────────────────────
#
# Direct-push-to-main workflow (standing rule): no branches, no PRs —
# so the gate triggers on push to main only.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint + typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      - name: Audit (high+ fails the gate)
        run: npm audit --omit=dev --audit-level=high || (echo '::warning::npm audit found high+ prod vulns' && exit 1)

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  deploy:
    name: Vercel production deploy (CLI)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Deploy hooks turned out NOT to bypass the Ignored Build Step on this
    # project (verified 2026-08-25: five hook/git builds all Canceled).
    # CLI deployments are never evaluated by the Ignored Build Step, so
    # this is the reliable "only CI can deploy" path. The build itself
    # still runs on Vercel's infra — the runner only uploads sources.
    # Only meaningful once the VERCEL_TOKEN secret exists — see
    # docs/deploy-gate.md.
    #
    # ── Dream-lab project split (2026-09-27) ──
    # Two Vercel projects build this repo (scripts/prune-for-target.mjs):
    #   resonance        — the real app, dream routes pruned (~23s build);
    #                      /dream/* proxies to the dream project.
    #   resonance-dream  — the full app serving the dream lab.
    # Path-aware deploys: a pure dream-lab push (the agent's twice-daily
    # protos) deploys ONLY resonance-dream; a push that never touches the
    # dream tree or shared runtime deploys ONLY resonance; anything mixed
    # or ambiguous deploys both. Verify (lint+typecheck+tests) always
    # covers the whole repo either way.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide deploy targets from changed paths
        id: targets
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit — deploying both."
            echo "core=true"  >> "$GITHUB_OUTPUT"
            echo "dream=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "Changed files:"; echo "$CHANGED"
          DREAM=false; CORE=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/app/dream/*|docs/dreams/*) DREAM=true ;;
              *) CORE=true; DREAM=true ;;  # shared code: dream build embeds it too
            esac
          done <<< "$CHANGED"
          echo "core=$CORE"   >> "$GITHUB_OUTPUT"
          echo "dream=$DREAM" >> "$GITHUB_OUTPUT"

      - name: Deploy resonance (core)
        if: steps.targets.outputs.core == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_nJRqVNTjzHtRvy93vgo1kwHX
          VERCEL_PROJECT_ID: prj_7xHbLJA0gx114hFP2KFht48ZAxQ9
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not set — gate is inert."
            exit 0
          fi
          echo "CI green — deploying CORE to production via Vercel CLI."
          # VERCEL_GIT_COMMIT_SHA feeds next.config.ts's gitShortSha()
          # fallback so /api/version keeps reporting the real commit
          # (CLI uploads don't include .git).
          npx vercel@latest deploy --prod --yes --archive=tgz \
            --token "$VERCEL_TOKEN" \
            --build-env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA"

      - name: Deploy resonance-dream (dream lab)
        if: steps.targets.outputs.dream == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_nJRqVNTjzHtRvy93vgo1kwHX
          VERCEL_PROJECT_ID: prj_XMJc3VKwgIu8SwopH3peO8kUzb8e
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not set — gate is inert."
            exit 0
          fi
          echo "CI green — deploying DREAM LAB to production via Vercel CLI."
          npx vercel@latest deploy --prod --yes --archive=tgz \
            --token "$VERCEL_TOKEN" \
            --build-env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA"
